name: Release Please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'boltz-bio/boltz-api-cli'
    runs-on: ${{ github.repository == 'boltz-bio/boltz-api-cli-staging' && 'namespace-profile-ci-1x2' || 'ubuntu-latest' }}

    steps:
      - name: Mint release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SDK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          owner: boltz-bio
          repositories: |
            boltz-api-cli
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.release-token.outputs.token }}
