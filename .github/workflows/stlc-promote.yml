name: Promote SDKs

# Open a merge-commit promotion PR whenever staging main advances. The PR is
# the production security and CI boundary; release-please remains the separate
# package-publication gate. Never squash or rebase this PR: a merge commit keeps
# every staging commit reachable so back-sync can preserve STLC lineage.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  promote:
    runs-on: namespace-profile-ci-1x2
    if: github.repository == 'boltz-bio/boltz-api-cli-staging'
    concurrency:
      group: stlc-promote
      cancel-in-progress: true
    env:
      PRODUCTION_REPO: boltz-bio/boltz-api-cli
    steps:
      - name: Mint production write token
        id: production-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.PROMOTE_APP_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          owner: boltz-bio
          repositories: |
            boltz-api-cli
          permission-contents: write
          permission-pull-requests: write

      - name: Check out staging
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch production main
        env:
          GH_TOKEN: ${{ steps.production-token.outputs.token }}
        run: |
          git remote add production \
            "https://x-access-token:${GH_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Check whether production already has staging's content
        id: diff
        run: |
          # After a release, production carries release-please's version/changelog
          # commits that staging lacks. Ask whether merging staging into production
          # would change production's tree: if not, production already has staging's content.
          MERGED=$(git merge-tree --write-tree production/main origin/main) || MERGED=conflict
          PRODUCTION_TREE=$(git rev-parse 'production/main^{tree}')
          if [ "$MERGED" = "$PRODUCTION_TREE" ]; then
            echo "Production already contains staging's content. Nothing to promote."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push staging main to the production release branch
        if: steps.diff.outputs.synced == 'false'
        run: |
          # This force-push is confined to the bot-owned PR carrier branch.
          git push production origin/main:refs/heads/stainless/release --force

      - name: Open or update the production promotion PR
        if: steps.diff.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ steps.production-token.outputs.token }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "${PRODUCTION_REPO}" \
            --head stainless/release \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "${PR_NUMBER}" ]; then
            PR_URL=$(gh pr create \
              --repo "${PRODUCTION_REPO}" \
              --base main \
              --head stainless/release \
              --title "chore(sdk): promote generated SDK" \
              --body "Automated STLC promotion from the private staging trunk. Merge with a merge commit; never squash or rebase.")
            PR_NUMBER=${PR_URL##*/}
          fi

          # Auto-merge waits for production's branch rules, reviews, and checks.
          # Failing here is intentional: a promotion must not silently become a
          # manual queue because repository policy drifted.
          gh pr merge "${PR_NUMBER}" \
            --repo "${PRODUCTION_REPO}" \
            --auto \
            --merge
