name: Trigger staging back-sync on release

# On a published release, notify the staging repo to sync from production immediately.
# This workflow is dispatch-only: it cannot write production or staging contents.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ${{ github.repository == 'boltz-bio/boltz-api-cli-staging' && 'namespace-profile-ci-1x2' || 'ubuntu-latest' }}
    if: github.repository == 'boltz-bio/boltz-api-cli'
    env:
      STAGING_REPO: boltz-bio/boltz-api-cli-staging
    steps:
      - name: Mint staging dispatch token
        id: staging-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PROMOTE_APP_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          owner: boltz-bio
          repositories: |
            boltz-api-cli-staging
          permission-contents: write

      - name: Dispatch back-sync to staging
        env:
          DISPATCH_TOKEN: ${{ steps.staging-token.outputs.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "${DISPATCH_TOKEN:-}" ] || { echo "promote-bot staging token was not minted" >&2; exit 1; }
          payload=$(jq -n --arg ref "$REF_NAME" '{event_type:"prod-released",client_payload:{ref:$ref}}')
          code=$(curl -sS -o /tmp/dispatch.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${STAGING_REPO}/dispatches" \
            -d "$payload")
          if [ "$code" = "204" ]; then
            echo "Back-sync dispatched to ${STAGING_REPO}."
          else
            echo "Dispatch failed (HTTP $code)" >&2; cat /tmp/dispatch.txt >&2; exit 1
          fi
